name: Cross-Compile & Publish Release

on:
  push:
    branches: [ "main" ] # Triggers when you push code to main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission required to publish GitHub Releases

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-gnu

    - name: Install Cross-Compilation Linker
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build Release Binary
      run: |
        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        cargo build --release --target aarch64-unknown-linux-gnu

    - name: Package Binary into Tarball
      run: |
        # Moving the raw binary to root and tarballing it preserves the executable chmod flags
        cp target/aarch64-unknown-linux-gnu/release/the-vault ./the-vault
        tar -czf the-vault-aarch64.tar.gz the-vault

    - name: Upload to Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: compilation-artifact
        path: the-vault-aarch64.tar.gz

    - name: Upload directly to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: the-vault-aarch64.tar.gz
